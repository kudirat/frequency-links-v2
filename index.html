<!DOCTYPE html>
<html lang="eng">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=.7" />
  <meta name="description" content="frequency messages (2026). a message board" />
  <meta name="robots" content="index,follow" />
  <meta property="og:title" content="frequency messages (2026)" />
  <meta property="og:type" content="article" />
  <meta property="og:url" />
  <meta property="og:description" content="frequency messages by Kudirat Alimi (2026)" />
  <meta name="twitter:card" content="summary" />
  <link rel="stylesheet" type="text/css" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
  <title>frequency-messages</title>
</head>

<body>
  <div id="main-container">
    <!-- <div id="square-canvas"> -->
      <form id="user-form">
        <div class="form-row" id="alias-row">
          <label id="alias-title">Alias?</label>
          <label id="prompt-title" class="hidden-element"></label>
          <input type="text" id="alias" name="user1-alias" value="user1">
        </div>
        <div class="form-row" id="favcolor-row">
          <label id="favcolor-title">Select a color:</label>
          <input type="color" id="favcolor" name="user1-color" value="#87CEEB">
        </div>
        <div class="form-row" id="txt-msg-row">
          <label id="txt-msg-title">Type a message:</label>
          <input type="text" id="txt-msg" name="user1-msg" value="hello">
        </div>
        <div class="form-row" id="speed-slider-row">
          <label id="speed-slider-title">Select a speed:</label>
          <input id="speed-slider" type="range" min="0" max="360" step="1">
        </div>
        <div class="form-row" id="submit-btn-row">
          <input id="submit-btn" type="submit" value="Submit">
        </div>
      </form>
    <!-- </div> -->
  </div>
  <!-- <div id="square"></div> -->
  <script type="module" src="sketch.js"></script>
</body>

</html>
